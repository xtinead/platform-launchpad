openapi: 3.1.0

info:
  title: Platform Launchpad API
  version: 1.0.0
  description: >
    REST API for Platform Launchpad, a self-service internal developer
    platform demonstration.

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Environments
  - name: Deployment Requests
  - name: Administration

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getLiveness
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: getReadiness
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/environments:
    get:
      tags: [Environments]
      summary: List current user's environments
      operationId: listEnvironments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EnvironmentStatusFilter"
        - $ref: "#/components/parameters/EnvironmentTypeFilter"
      responses:
        "200":
          description: Paginated environment collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Environments]
      summary: Create an environment request
      operationId: createEnvironment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreateRequest"
      responses:
        "202":
          description: Environment request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/environments/{environment_id}:
    get:
      tags: [Environments]
      summary: Get an environment
      operationId: getEnvironment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: Environment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/environments/{environment_id}/destroy:
    post:
      tags: [Environments]
      summary: Request environment destruction
      operationId: destroyEnvironment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "202":
          description: Destruction request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/environments/{environment_id}/deployment-requests:
    get:
      tags: [Deployment Requests]
      summary: List deployment requests for an environment
      operationId: listEnvironmentDeploymentRequests
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated deployment-request collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deployment-requests/{request_id}:
    get:
      tags: [Deployment Requests]
      summary: Get a deployment request
      operationId: getDeploymentRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeploymentRequestId"
      responses:
        "200":
          description: Deployment-request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users:
    get:
      tags: [Administration]
      summary: List users
      operationId: adminListUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated user collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{user_id}:
    patch:
      tags: [Administration]
      summary: Enable or disable a user
      operationId: adminUpdateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/environments:
    get:
      tags: [Administration]
      summary: List all environments
      operationId: adminListEnvironments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EnvironmentStatusFilter"
        - $ref: "#/components/parameters/EnvironmentTypeFilter"
      responses:
        "200":
          description: Paginated environment collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/audit-logs:
    get:
      tags: [Administration]
      summary: List audit logs
      operationId: adminListAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated audit-log collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DeploymentRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EnvironmentStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/EnvironmentStatus"

    EnvironmentTypeFilter:
      name: environment_type
      in: query
      schema:
        $ref: "#/components/schemas/EnvironmentType"

  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Resource or lifecycle conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: Required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    UserRole:
      type: string
      enum:
        - user
        - admin

    EnvironmentType:
      type: string
      enum:
        - development
        - staging
        - demo

    EnvironmentStatus:
      type: string
      enum:
        - pending
        - provisioning
        - active
        - failed
        - destroying
        - destroyed

    DeploymentOperation:
      type: string
      enum:
        - provision
        - destroy
        - retry
        - upgrade

    DeploymentRequestStatus:
      type: string
      enum:
        - queued
        - processing
        - succeeded
        - failed
        - cancelled

    UserRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        full_name:
          type: string
          minLength: 2
          maxLength: 150

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UserSummary:
      type: object
      required:
        - id
        - email
        - full_name
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean

    UserResponse:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          required:
            - created_at
            - updated_at
          properties:
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            last_login_at:
              type:
                - string
                - "null"
              format: date-time

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: "#/components/schemas/UserSummary"

    EnvironmentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - environment_type
        - application_version
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
        environment_type:
          $ref: "#/components/schemas/EnvironmentType"
        application_version:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 1000

    EnvironmentResponse:
      type: object
      required:
        - id
        - owner_id
        - name
        - environment_type
        - application_version
        - status
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        environment_type:
          $ref: "#/components/schemas/EnvironmentType"
        application_version:
          type: string
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/EnvironmentStatus"
        external_url:
          type:
            - string
            - "null"
          format: uri
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        destroyed_at:
          type:
            - string
            - "null"
          format: date-time

    DeploymentRequestResponse:
      type: object
      required:
        - id
        - environment_id
        - requested_by_id
        - operation
        - status
        - attempt_count
        - request_payload
        - requested_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        requested_by_id:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/DeploymentOperation"
        status:
          $ref: "#/components/schemas/DeploymentRequestStatus"
        attempt_count:
          type: integer
          minimum: 0
        error_message:
          type:
            - string
            - "null"
        request_payload:
          type: object
          additionalProperties: true
        requested_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type: string
          format: date-time

    EnvironmentOperationResponse:
      type: object
      required:
        - environment
        - deployment_request
      properties:
        environment:
          $ref: "#/components/schemas/EnvironmentResponse"
        deployment_request:
          $ref: "#/components/schemas/DeploymentRequestResponse"

    PaginationMetadata:
      type: object
      required:
        - page
        - page_size
        - total_items
        - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer

    EnvironmentListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnvironmentResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"

    DeploymentRequestListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentRequestResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"

    UserListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"

    AdminUserUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - is_active
      properties:
        is_active:
          type: boolean

    AuditLogResponse:
      type: object
      required:
        - id
        - action
        - resource_type
        - result
        - details
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type:
            - string
            - "null"
          format: uuid
        environment_id:
          type:
            - string
            - "null"
          format: uuid
        deployment_request_id:
          type:
            - string
            - "null"
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type:
            - string
            - "null"
          format: uuid
        result:
          type: string
          enum:
            - success
            - failure
            - denied
        message:
          type:
            - string
            - "null"
        details:
          type: object
          additionalProperties: true
        source_ip:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogResponse"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"

    LivenessResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string

    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          additionalProperties:
            type: string

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - details
        - request_id
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"